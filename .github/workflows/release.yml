# 打 tag vX.Y.Z（或 vX.Y.Z-beta.N）后构建服务端安装包与 Android APK 并发布 Release（docs/02-release.md §3）。
# 资产名须与服务端检查更新（server/internal/update）一致：
#   lfb-server-setup-<版本>.exe、lfb-app-<abi>.apk、checksums.txt（sha256sum 格式）
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  server:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 版本号
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: 测试
        run: go test ./...
      - name: 构建 exe
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$VERSION" -o dist/lfb-server.exe ./cmd/server
      - name: 编译安装包
        # Inno Setup 已预装在 windows-latest（iscc 在 PATH 中）；用 pwsh 避免 Git Bash 把 /D 参数当作路径转换
        shell: pwsh
        run: iscc "/DAppVersion=$env:VERSION" installer\lfb-server.iss
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: server/dist/lfb-server-setup-*.exe
          if-no-files-found: error

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少 ANDROID_* 签名 Secrets" && exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          # storeFile 相对 app/android/（见 android/app/build.gradle.kts）
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: 构建 APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 \
            --build-name="${GITHUB_REF_NAME#v}" --build-number=${{ github.run_number }}
      - name: 按发布命名
        run: |
          mkdir -p ../out
          for abi in arm64-v8a armeabi-v7a; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../out/lfb-app-$abi.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: out/lfb-app-*.apk
          if-no-files-found: error

  release:
    needs: [server, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: 生成 checksums.txt
        working-directory: out
        run: |
          sha256sum lfb-server-setup-*.exe lfb-app-*.apk > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # vX.Y.Z-beta.N 等含 '-' 的 tag 为预发布，不会成为 releases/latest
          prerelease: ${{ contains(github.ref_name, '-') }}
