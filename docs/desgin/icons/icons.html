<!DOCTYPE html>
<!--
  LAN File Browser Android 应用图标 · 5 个备选方案预览
  - 每个方案 = 前景层 fg + 背景层 bg（108×108，关键内容在中心直径 66 的圆内）+ 单色层 mono（Android 13 主题图标）
  - 预览按启动器实际显示的中心 72×72 区域渲染，再套圆形 / 圆角方形 / 水滴形遮罩
  - 方案 1、2 取自电脑端“家庭影院”色板（李子褐 #2A1D24、幕布红 #8E2433、琥珀 #E9B44C、银幕白 #EEE8DC）
  - 只用 Windows 系统字体，无外部资源；本文件由脚本生成，SVG 内容与同目录下的 .svg 文件一致
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>应用图标备选 · LAN File Browser</title>
<style>
  :root{
    --ink:#2A1D24; --paper:#EFEBE6; --rule:#D8D0C8; --muted:#7A6A70;
    --cn:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    --num:"Bahnschrift","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--cn)}
  .top{max-width:1180px;margin:0 auto;padding:48px 32px 8px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
  .top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.02em}
  .top p{margin:6px 0 0;color:var(--muted);max-width:62ch}
  .top label{font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
  .top input{accent-color:#8E2433;margin-right:6px}
  main{max-width:1180px;margin:0 auto;padding:0 32px 64px}

  .opt{display:grid;grid-template-columns:260px 1fr;gap:20px 40px;padding:40px 0;border-top:1px solid var(--rule)}
  .opt:first-child{border-top:0}
  .opt-head{display:flex;gap:14px;grid-row:span 2}
  .num{font:600 44px/1 var(--num);font-stretch:condensed;color:#B9ADB2}
  .opt-head h2{margin:2px 0 6px;font-size:22px;font-weight:800}
  .opt-head p{margin:0;color:#4D3F45;font-size:14px}
  .opt-head .files{margin-top:14px;color:var(--muted);font:12px/1.4 var(--num)}
  .sw{display:flex;gap:6px;list-style:none;padding:0;margin:14px 0 0}
  .sw li{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

  .big{display:flex;gap:28px;flex-wrap:wrap;align-items:end}
  figure{margin:0}
  .big figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}

  .small{display:flex;gap:12px;align-items:center;flex-wrap:wrap;grid-column:2}
  .small p{margin:0;font:13px var(--num);color:var(--muted)}
  .chip{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:12px}
  .chip.light{background:#FAF8F5;box-shadow:inset 0 0 0 1px var(--rule)}
  .chip.dark{background:#1C1B1F}

  .homes{grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .wall{display:flex;justify-content:space-around;padding:22px 6px 14px;border-radius:18px}
  .wall-light{background:linear-gradient(160deg,#F6E7D8,#D9E4EE 60%,#C7D6E8)}
  .wall-dark{background:linear-gradient(160deg,#1E2433,#2B2234 55%,#141418)}
  .app{display:flex;flex-direction:column;align-items:center;gap:5px;width:62px}
  .app figcaption{font-size:11px;white-space:nowrap}
  .wall-light .app figcaption{color:#2B2B30}
  .wall-dark .app figcaption{color:#ECE9F0}

  /* adaptive icon rendering */
  .ic{position:relative;width:var(--s);height:var(--s);overflow:hidden;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .ic svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .circle{border-radius:50%}
  .squircle{border-radius:23%}
  .tear{border-radius:50% 50% 14% 50%}
  .themed{color:#0E3A7A;background:#D6E4FB}
  .themed-dark .themed{color:#C9DCFF;background:#2E3A52}
  .ic .safe{display:none}
  .safe circle{fill:none;stroke:#fff;stroke-width:.5;stroke-dasharray:2 1.5;mix-blend-mode:difference}
  body.show-safe .ic .safe{display:block}

  @media (max-width:900px){
    .opt{grid-template-columns:1fr}
    .opt-head{grid-row:auto}
    .small{grid-column:1}
    .homes{grid-template-columns:1fr 1fr}
  }
</style>
</head>
