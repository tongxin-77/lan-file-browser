<!doctype html>
<!--
================================================================
 LAN File Browser · Android App 设计稿 A4「床头夜读」
================================================================
【场景】关灯后躺在床上，手机举在脸前，单手拇指操作。眼睛已适应黑暗，
任何一块亮白都会刺眼。界面要像床头那盏调到最暗的夜灯：只照亮手边一小片，
其余退进被褥的暗色里，让海报、画面、照片自己发光。

【配色】全部取自真实夜间卧室，低蓝光（所有界面色蓝通道都低于红通道）
  被褥 Quilt      #201719  主背景：深梅褐色的被面，不是黑
  枕套 Pillow     #2A1F22  抬起的表面（列表行、键盘键）
  褶缝 Seam       #3A2D30  分隔、描边
  灯芯 Lampwick   #E2A35E  唯一的强调色：暖钨丝灯的琥珀，用于可操作的主按钮、进度
  月光纸 Moonpaper #DCCFBB  主文字：被月光照到的米色纸，避免纯白
  烛灰 Ash        #9F8F89  次要文字（被褥底上 5.65:1，灯晕最亮处 ≥4.6:1；压在视频画面上的次要文字改用月光纸）
  晨苔 Moss       #8E9A7C  “看完了”状态，安静的灰绿
  房间 Room       #17100F  设计稿画布（不在 App 内使用）

【字体】设计稿仅用 Windows 系统字体
  界面/标题：DengXian（等线）与 DengXian Light —— 笔画细、灰度低，夜里不“发亮”
  数字/时长/时间码：Bahnschrift（SemiLight 宽度感）—— 等宽数字，进度跳动不抖
  回退：Microsoft YaHei UI、Segoe UI
【最终 App 建议打包字体】
  中文界面：HarmonyOS Sans SC（Light / Regular / Medium 三个字重即可）
           或 思源黑体 Source Han Sans SC Light/Regular（OFL）
  数字：Barlow Semi Condensed（OFL，Light/Regular），开启 tabular-nums
  不打包粗体以外的展示字体，控制 APK 体积

【布局】
  ┌──────────────┐  上半屏：安静区 —— 只放内容与信息，没有按钮
  │ 标题（细体大字）│  （举着手机时上半屏拇指够不到）
  │ 内容 / 海报    │
  ├──────────────┤
  │░░ 灯晕区 ░░░░│  下 40%：拇指区 —— 所有操作、面包屑、排序、键盘
  │░ 按钮 按钮 ░░│  背后是一圈从底边升起的暖光，像夜灯照在被子上
  └────▬─────────┘  Android 手势条 + 底部安全区
  文字一律左对齐；横屏播放器把控件放在左右下角（双手拇指）。

【原则】
  1. 灯晕是唯一的记忆点：每屏只有底部一圈暖光，操作都在光里，光外不放按钮。
  2. 静置即隐退：3 秒不碰屏幕，状态栏、标签、次要文字降到 32% 透明度（可在稿中体验）。
  3. 内容发光，界面不发光：海报/画面/照片保持原亮度，界面文字用月光纸而非白色。
  4. 手势优先：左右滑切图、双指缩放、播放器左侧上下滑调亮度，按钮只是兜底。
  5. 触控目标 ≥ 48dp；行高 64dp；键盘键 60dp。

【对照默认方案的修正】
  - 初稿用了近黑 #121212 + 琥珀单色强调，等于“近黑+单一荧光色”的套路 →
    底色改为带梅紫的被褥色，强调色降饱和为钨丝灯，并加入晨苔绿表达“看完了”。
  - 初稿首页是一排同样圆角+阴影的卡片 → 改为：继续观看用大海报，文件夹放进灯晕里，
    不加阴影，只用明度差分层。
  - 初稿把路径和排序放在顶部（Material 默认）→ 移到底部拇指区。

【加密片库补充（依据 docs/04-vault.md 第 4、8 节）】
  - 无可见入口：首页长按电脑名称（“LI-PC 已连接”）约 0.6 秒弹出密码框，按下时不给任何反馈。
  - 2a 密码框：即本 App 的通用对话框——底部暖光里的抬起面板，标题只写“输入密码”，
    数字键盘 / 字母键盘可切换，4–16 位。密码不对时只清空并轻微左右抖一下，
    与“根本没有这类文件夹”时完全相同，不出现任何错误文案。
  - 2b 解锁后首页：多出的文件夹与普通文件夹同款，名字后仅一个 5px 空心小圆点；
    第 6 格放“现在收起”，并用一行淡字说明离开 App、锁屏或 10 分钟不动会自动收起。
    全稿不出现“私密”“加密”“已锁定”等字样。
  - 稿中演示：任一首页画框长按电脑名称 → 输入 0000 → 变为解锁状态；其他密码清空并抖动；
    点“现在收起”恢复原样。原首页的第 4 个文件夹改为“纪录片”，以免与多出的“工作资料”重复。
================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>床头夜读：LAN File Browser 手机端设计稿 A4</title>
<style>
:root{
  --quilt:#201719; --pillow:#2A1F22; --seam:#3A2D30;
  --wick:#E2A35E; --moon:#DCCFBB; --ash:#9F8F89; --moss:#8E9A7C; --room:#17100F;
  --ui:"DengXian","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;
  --light:"DengXian Light","DengXian","Microsoft YaHei UI Light","Segoe UI Light",sans-serif;
  --num:"Bahnschrift","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--room)}
body{font-family:var(--ui);color:var(--moon);background:var(--room);padding:56px 48px 96px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--wick);outline-offset:2px;border-radius:10px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- 画布说明 ---------- */
.intro{max-width:640px;margin-bottom:56px}
.intro h1{font-family:var(--light);font-weight:300;font-size:44px;letter-spacing:.04em;line-height:1.2}
.intro p{color:var(--ash);font-size:15px;line-height:1.8;margin-top:14px}
.intro p b{color:var(--moon);font-weight:400}
.board{display:flex;flex-wrap:wrap;gap:56px 48px;align-items:flex-start}
figure{display:flex;flex-direction:column;gap:16px}
figcaption{max-width:390px;font-size:13px;line-height:1.7;color:var(--ash)}
figcaption b{display:block;color:var(--moon);font-weight:400;font-size:15px;margin-bottom:2px}
.land + figcaption{max-width:844px}

/* ---------- 手机画框 ---------- */
.phone{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--quilt);
  box-shadow:0 0 0 9px #261C1E,0 0 0 10px #3A2D30,0 40px 80px -30px rgba(0,0,0,.7);isolation:isolate}
.land{width:844px;height:390px;border-radius:42px}
.pool{position:absolute;inset:auto 0 0 0;height:60%;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 50% 112%,rgba(226,150,82,.22),rgba(226,150,82,.07) 46%,transparent 72%)}
.sb{position:absolute;top:0;left:0;right:0;height:38px;padding:12px 28px 0;display:flex;justify-content:space-between;
  font-family:var(--num);font-size:13px;color:var(--ash);z-index:3}
.sb i{display:inline-block;vertical-align:middle;margin-left:6px}
.sb .wifi{width:14px;height:10px;border-radius:14px 14px 0 0;border:2px solid var(--ash);border-bottom:0}
.sb .bat{width:22px;height:11px;border:1.5px solid var(--ash);border-radius:3px;position:relative}
.sb .bat::after{content:"";position:absolute;inset:1.5px 8px 1.5px 1.5px;background:var(--ash);border-radius:1px}
.gnav{position:absolute;bottom:0;left:0;right:0;height:26px;display:flex;justify-content:center;align-items:center;z-index:3}
.gnav i{width:108px;height:4px;border-radius:4px;background:rgba(220,207,187,.38)}
.scr{position:absolute;top:38px;bottom:26px;left:0;right:0;display:flex;flex-direction:column;padding:0 24px;z-index:1}
.recede{transition:opacity 1.2s ease}
.rest .recede{opacity:.32}

/* ---------- 通用 ---------- */
.hero{font-family:var(--light);font-weight:300;font-size:32px;line-height:1.25;letter-spacing:.02em}
.lede{color:var(--ash);font-size:15px;line-height:1.7;margin-top:10px;max-width:30em}
.sec{font-size:14px;color:var(--ash);margin:28px 0 10px}
.thumbzone{margin-top:auto;padding-bottom:18px;display:flex;flex-direction:column;gap:12px}
.btn{height:56px;border-radius:28px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.lamp{background:var(--wick);color:#2A1A10;box-shadow:0 0 36px -6px rgba(226,163,94,.55)}
.btn.quiet{border:1px solid var(--seam);color:var(--moon);background:rgba(42,31,34,.6)}
.hint{font-size:13px;color:var(--ash);line-height:1.6;text-align:left;padding:0 4px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar{height:3px;border-radius:3px;background:rgba(220,207,187,.14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--wick);border-radius:3px}

/* ---------- 1 连接 ---------- */
.s-connect .top{padding-top:64px}
.finding{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ash);margin:44px 0 12px}
.breath{width:8px;height:8px;border-radius:50%;background:var(--wick);animation:breath 3.2s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.25;box-shadow:0 0 0 0 rgba(226,163,94,0)}50%{opacity:1;box-shadow:0 0 14px 3px rgba(226,163,94,.35)}}
.pc{display:flex;align-items:center;gap:16px;width:100%;min-height:76px;padding:0 18px;border-radius:20px;background:var(--pillow);text-align:left}
.pc .scrn{width:44px;height:44px;border-radius:12px;background:rgba(226,163,94,.1);color:var(--wick);display:grid;place-items:center}
.pc b{display:block;font-weight:400;font-size:18px}
.pc small{font-size:13px;color:var(--ash)}
.pc .go{margin-left:auto;font-size:15px;color:var(--wick)}
.none{font-size:13px;color:var(--ash);margin-top:14px;line-height:1.6;padding:0 4px}

/* ---------- 1b 配对 ---------- */
.s-pair .top{padding-top:40px}
.who{font-size:14px;color:var(--ash);display:flex;gap:10px;align-items:baseline}
.who b{color:var(--moon);font-weight:400;font-size:16px}
.code{display:flex;gap:10px;margin-top:34px}
.code span{flex:1;height:64px;border-radius:14px;background:var(--pillow);display:grid;place-items:center;font-family:var(--num);font-size:30px;font-weight:300;color:var(--moon);position:relative}
.code span.cur::after{content:"";width:2px;height:28px;background:var(--wick);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pstate{font-size:14px;color:var(--ash);margin-top:14px;min-height:22px}
.pstate.ok{color:var(--moss)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:60px;border-radius:16px;font-family:var(--num);font-size:26px;font-weight:300;background:rgba(42,31,34,.55)}
.keys button:active{background:rgba(226,163,94,.18)}
.keys .t{font-family:var(--ui);font-size:14px;color:var(--ash)}

/* ---------- 2 首页 ---------- */
.s-home .head{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.conn{display:flex;flex-direction:column;gap:2px}
.conn b{font-weight:400;font-size:17px;display:flex;align-items:center;gap:8px}
.conn b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--moss);box-shadow:0 0 8px var(--moss)}
.conn small{font-size:12px;color:var(--ash);padding-left:15px}
.iconbtn{width:48px;height:48px;display:grid;place-items:center;border-radius:24px;color:var(--ash)}
.feature{position:relative;height:236px;border-radius:24px;overflow:hidden;margin-top:6px;display:block;width:100%;text-align:left}
.feature .art{position:absolute;inset:0}
.feature .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(32,23,25,.92) 88%)}
.feature .txt{position:absolute;left:20px;right:20px;bottom:18px}
.feature h3{font-family:var(--light);font-weight:300;font-size:28px;letter-spacing:.06em}
.feature p{font-size:14px;color:var(--moon);opacity:.8;margin:4px 0 12px;display:flex;justify-content:space-between}
.feature .play{position:absolute;right:18px;top:18px;width:52px;height:52px;border-radius:50%;background:rgba(32,23,25,.55);display:grid;place-items:center;color:var(--wick);backdrop-filter:blur(6px)}
.also{display:flex;gap:14px;align-items:center;margin-top:12px;min-height:64px;width:100%;text-align:left}
.also .mini{width:76px;height:50px;border-radius:10px;flex:none;background:linear-gradient(170deg,#4A3A3C 0%,#2E2528 55%,#5B4434 56%,#2A1F22 70%)}
.also .t{flex:1}
.also b{font-weight:400;font-size:16px}
.also small{display:block;font-size:13px;color:var(--ash);margin:3px 0 7px}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.folders button{height:92px;border-radius:20px;background:rgba(42,31,34,.62);text-align:left;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.folders .ic{color:var(--wick);opacity:.85}
.folders b{font-weight:400;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.folders small{font-size:13px;color:var(--ash)}

/* ---------- 2a 输入密码 / 2b 解锁后首页 ---------- */
.conn b{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.folders .vault,.folders .lockcell{display:none}
.unlocked .folders .vault,.unlocked .folders .lockcell{display:flex}
.unlocked .folders button{height:80px}
.folders .mark{display:inline-block;width:5px;height:5px;border-radius:50%;border:1px solid var(--ash);margin-left:7px;vertical-align:middle;opacity:.8}
.folders .lockcell{background:transparent;border:1px solid var(--seam);padding:12px 16px}
.folders .lockcell b{font-size:16px}
.folders .lockcell small{font-size:12px;line-height:1.4}
.dlg{position:absolute;inset:0;z-index:5;background:rgba(23,16,15,.62)}
.dlg[hidden]{display:none}
.sheet{position:absolute;left:12px;right:12px;bottom:34px;border-radius:28px;background:var(--pillow);padding:22px 16px 16px;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 0 60px -10px rgba(226,150,82,.28)}
.sheet h3{font-family:var(--light);font-weight:300;font-size:24px;letter-spacing:.02em;padding:0 6px}
.pw{height:56px;border-radius:16px;background:var(--quilt);border:1px solid var(--seam);display:flex;align-items:center;gap:10px;padding:0 18px}
.pw i{width:10px;height:10px;border-radius:50%;background:var(--moon)}
.pw::after{content:"";width:2px;height:26px;background:var(--wick);animation:blink 1.1s steps(1) infinite}
.sheet.shake{animation:shake .36s ease}
@keyframes shake{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}100%{transform:none}}
.abc{display:flex;flex-direction:column;gap:8px}
.abc div{display:flex;gap:5px;justify-content:center}
.abc button{flex:1;max-width:32px;height:52px;border-radius:10px;font-size:19px;background:rgba(58,45,48,.55)}
.abc button.t{max-width:none;flex:1.6;font-family:var(--ui);font-size:14px;color:var(--ash)}
.abc button:active{background:rgba(226,163,94,.18)}
.dacts{display:flex;gap:10px}
.dacts .btn{flex:1;height:52px;font-size:16px}

/* ---------- 3 文件夹 ---------- */
.s-folder .top{padding-top:18px;padding-bottom:6px}
.s-folder .top small{font-size:14px;color:var(--ash)}
.s-folder .hero{font-size:30px;margin-top:2px}
.s-folder .top p{font-size:13px;color:var(--ash);margin-top:6px}
.list{flex:1;overflow-y:auto;margin:0 -24px;padding:6px 24px 160px;scrollbar-width:none;
  -webkit-mask:linear-gradient(180deg,transparent 0,#000 14px,#000 100%);
          mask:linear-gradient(180deg,transparent 0,#000 14px,#000 100%)}
.list::-webkit-scrollbar{display:none}
.row{display:flex;gap:14px;align-items:center;min-height:68px;padding:8px 0;width:100%;text-align:left}
.row .tn{position:relative;width:104px;height:58px;border-radius:10px;overflow:hidden;flex:none}
.row .tn .d{position:absolute;right:5px;bottom:4px;font-family:var(--num);font-size:11px;color:#EADFCF;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.row .tn .p{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.4)}
.row .tn .p i{display:block;height:100%;background:var(--wick)}
.row.seen .tn{filter:saturate(.45) brightness(.7)}
.row .meta{flex:1;min-width:0}
.row b{font-weight:400;font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:12px;color:var(--ash);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-size:12px;margin-top:5px;display:flex;gap:6px;align-items:center}
.row.seen b{color:#B5A79A}
.st.done{color:var(--moss)}
.st.part{color:var(--wick)}
.st.new{color:var(--ash)}
.glyph{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--pillow);color:var(--ash);font-size:15px}
.glyph.fold{color:var(--wick);background:rgba(226,163,94,.09)}
.row .glyph{margin:0 29px}
.subhead{font-size:13px;color:var(--ash);padding:16px 0 4px}
.list.grid .vids{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.list.grid .vids .row{flex-direction:column;align-items:stretch;gap:8px;padding:0}
.list.grid .vids .row .tn{width:100%;height:auto;aspect-ratio:16/9}
.list.grid .vids .row small{display:none}
.tools{position:absolute;left:0;right:0;bottom:26px;padding:30px 16px 8px;background:radial-gradient(120% 100% at 50% 130%,rgba(226,150,82,.2),transparent 70%),linear-gradient(180deg,rgba(32,23,25,0),rgba(32,23,25,.95) 24%);display:flex;flex-direction:column;gap:8px;z-index:2}
.crumbs{display:flex;align-items:center;gap:2px;font-size:14px;color:var(--ash);overflow:hidden}
.crumbs button{height:48px;padding:0 10px;border-radius:24px;color:var(--ash)}
.crumbs b{font-weight:400;color:var(--moon);padding:0 10px}
.toolrow{display:flex;gap:8px}
.seg{display:flex;background:rgba(42,31,34,.85);border-radius:26px;padding:4px;flex:1}
.seg button{flex:1;height:44px;border-radius:22px;font-size:14px;color:var(--ash);display:flex;align-items:center;justify-content:center;gap:4px}
.seg button[aria-pressed=true]{background:rgba(226,163,94,.16);color:var(--wick)}
.seg.view{flex:none}
.seg.view button{width:52px;flex:none}

/* ---------- 4 播放器 ---------- */
.stage{position:absolute;inset:0}
.stage svg{width:100%;height:100%;display:block}
.vgrad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,16,15,.7) 0,transparent 26%,transparent 62%,rgba(23,16,15,.85) 100%);pointer-events:none}
.pl-top{position:absolute;top:18px;left:28px;right:28px;display:flex;align-items:center;gap:8px;z-index:4}
.pl-top .ttl{flex:1}
.pl-top .ttl b{font-weight:400;font-size:17px}
.pl-top .ttl small{font-size:13px;color:var(--ash);margin-left:10px}
.chip{height:48px;padding:0 16px;border-radius:24px;font-size:14px;background:rgba(32,23,25,.5);display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px)}
.chip span{color:var(--ash)}
.pl-mid{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:56px;z-index:2;transition:right .3s}
.pl-mid button{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--moon)}
.pl-mid .big{width:76px;height:76px;background:rgba(32,23,25,.45);backdrop-filter:blur(6px);color:var(--wick)}

<body>

<header class="intro">
  <h1>床头夜读</h1>
  <p>为关灯后躺在床上看片而设计。界面像一盏调到最暗的夜灯：<b>所有操作都在屏幕下方那圈暖光里</b>，拇指刚好够得到；上半屏只放内容。</p>
  <p>3 秒不碰任何一屏，状态栏和次要文字会退到暗处，可以停下鼠标试试。</p>
</header>

<main class="board">

<!-- ============ 1a 连接电脑：发现 ============ -->
<figure>
<div class="phone">

    <button class="pc" type="button">

</figure>

<script>
/* ---------- 2a/2b 由首页画框复制，并挂上密码框 ---------- */
(()=>{const home=document.getElementById('home');
document.querySelectorAll('[data-from=home]').forEach(p=>{p.innerHTML=home.innerHTML});
const del='<svg class="ic" viewBox="0 0 24 24" style="margin:auto"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M12 10l4 4M16 10l-4 4"/></svg>';
const NUM=[...'123456789'].map(k=>`<button>${k}</button>`).join('')+'<button class="t" data-k="mode">ABC</button><button>0</button><button class="t" data-k="del" aria-label="删除">'+del+'</button>';
const ABC=['qwertyuiop','asdfghjkl'].map(r=>'<div>'+[...r].map(k=>`<button>${k}</button>`).join('')+'</div>').join('')
  +'<div><button class="t" data-k="mode">123</button>'+[...'zxcvbnm'].map(k=>`<button>${k}</button>`).join('')+'<button class="t" data-k="del" aria-label="删除">'+del+'</button></div>';
[home,...document.querySelectorAll('[data-from=home]')].forEach(p=>{
  const d=document.createElement('div');d.className='dlg';d.hidden=p.dataset.dlg!=='open';
  d.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="输入密码"><h3>输入密码</h3><div class="pw" aria-label="已输入的字符"></div><div class="kb"></div>'
    +'<div class="dacts"><button class="btn quiet" data-a="cancel">取消</button><button class="btn lamp" data-a="ok">确定</button></div></div>';
  p.appendChild(d);
  const sheet=d.firstChild,pw=d.querySelector('.pw'),kb=d.querySelector('.kb');
  let v=d.hidden?'':'73',abc=false,timer;
  const draw=()=>{pw.innerHTML='<i></i>'.repeat(v.length);kb.className='kb '+(abc?'abc':'keys');kb.innerHTML=abc?ABC:NUM};
  const open=()=>{v='';abc=false;draw();d.hidden=false};
  d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    const k=b.dataset.k,a=b.dataset.a;
    if(a==='cancel'){d.hidden=true;return}
    if(a==='ok'){if(v==='0000'){d.hidden=true;p.classList.add('unlocked')}
      else{v='';draw();sheet.classList.remove('shake');void sheet.offsetWidth;sheet.classList.add('shake')}return}
    if(k==='mode'){abc=!abc}else if(k==='del'){v=v.slice(0,-1)}else if(v.length<16){v+=b.textContent.trim()}
    draw()});
  p.querySelector('[data-a=lock]').addEventListener('click',()=>p.classList.remove('unlocked'));
  const name=p.querySelector('.conn b'),stop=()=>clearTimeout(timer);
  name.addEventListener('pointerdown',()=>{stop();timer=setTimeout(open,600)});
  ['pointerup','pointerleave','pointercancel'].forEach(e=>name.addEventListener(e,stop));
  name.addEventListener('contextmenu',e=>e.preventDefault());
  draw()});})();

/* ---------- 静置隐退 ---------- */
document.querySelectorAll('.phone').forEach(p=>{
  let t;const wake=()=>{p.classList.remove('rest');clearTimeout(t);t=setTimeout(()=>p.classList.add('rest'),3000)};
  ['pointermove','pointerdown','keydown','focusin'].forEach(e=>p.addEventListener(e,wake));wake();
});

/* ---------- 1b 配对码 ---------- */
(()=>{const box=[...document.querySelectorAll('#code span')],st=document.getElementById('pstate');
let v='482';
const draw=()=>{box.forEach((b,i)=>{b.textContent=v[i]||'';b.classList.toggle('cur',i===v.length)});
  if(v.length===6){st.textContent='已连接 LI-PC';st.classList.add('ok')}else{st.textContent=v.length?'已输入 '+v.length+' 位，输满 6 位会自动连接':'输满 6 位会自动连接';st.classList.remove('ok')}};
document.getElementById('keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const k=b.dataset.k;if(k==='del'){v=v.slice(0,-1)}else if(k==='back'){v=''}else if(v.length<6){v+=b.textContent.trim()}
  else{v=b.textContent.trim()}draw()});draw();})();

/* ---------- 3 文件夹 ---------- */
const names=['启航','星图','无人港','回声','盐与铁','远灯','潮汐表','夜航','失重','信标','风暴眼','灯塔','归途'];
const durs=['23:58','24:10','24:05','23:51','24:12','24:02','23:47','24:10','24:08','23:55','24:14','24:10','24:06'];
const sizes=[1.18,1.21,1.20,1.16,1.24,1.19,1.15,1.22,1.21,1.17,1.26,1.23,1.20];
const eps=names.map((n,i)=>({i,n,d:durs[i],s:sizes[i],t:i}));
const art=i=>{const h=(300+i*6)%360,m=10+((i*37)%70);
  return `background:radial-gradient(circle at ${m}% 26%,#E6D7BE 0 5%,transparent 6%),linear-gradient(180deg,hsl(${h} 24% 17%) 0 54%,hsl(${(h+30)%360} 42% 40%) 56%,hsl(${h} 22% 20%) 58%,hsl(${h} 20% 10%) 100%)`};
const others=[
 {g:'字',n:'星海旅人.S01.chs.srt',m:'中文字幕，播放时自动加载',s:.0001,t:13},
 {g:'<svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M5 18l5-4 4 3 2-2 3 3"/></svg>',n:'poster.jpg',m:'图片，点开查看',s:.002,t:14},
 {g:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h4"/></svg>',n:'tvshow.nfo',m:'剧集资料，无法预览',s:.00001,t:15}];
let sortKey='name',view='list';
function renderList(){
  const L=document.getElementById('list');L.className='list'+(view==='grid'?' grid':'');
  const k={name:(a,b)=>a.i-b.i,time:(a,b)=>b.t-a.t,size:(a,b)=>b.s-a.s}[sortKey];
  const ko={name:(a,b)=>a.n.localeCompare(b.n),time:(a,b)=>b.t-a.t,size:(a,b)=>b.s-a.s}[sortKey];
  const ep=[...eps].sort(k).map(e=>{const seen=e.i<11,part=e.i===11,num=String(e.i+1).padStart(2,'0');
    const st=seen?'<span class="st done">✓ 看完了</span>':part?'<span class="st part">看到 70%，还剩 7 分钟</span>':'<span class="st new">还没看</span>';
    return `<button class="row${seen?' seen':''}"><span class="tn" style="${art(e.i)}"><span class="d">${e.d}</span>${part?'<span class="p"><i style="width:70%"></i></span>':''}</span>
    <span class="meta"><b>第 ${e.i+1} 集 ${e.n}</b><small>星海旅人 S01E${num} ${e.n}.mkv　${e.s.toFixed(2)} GB</small>${st}</span></button>`}).join('');
  const ot=[...others].sort(ko).map(o=>`<button class="row"><span class="glyph" style="margin:0 29px">${o.g}</span><span class="meta"><b>${o.n}</b><small>${o.m}</small></span></button>`).join('');
  L.innerHTML=`<button class="row"><span class="glyph fold" style="margin:0 29px"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="meta"><b>Extras</b><small>文件夹，8 项</small></span></button>
  <p class="subhead">视频</p><div class="vids">${ep}</div><p class="subhead">其他文件</p>${ot}`;
}
const seg=(id,cb)=>document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b)});
seg('sort',b=>{sortKey=b.dataset.s;renderList()});seg('view',b=>{view=b.dataset.v;renderList()});
renderList();

/* ---------- 4a 选集 ---------- */
document.getElementById('eps').innerHTML=names.map((n,i)=>`<button class="${i<11?'w':''}${i===11?' now':''}" aria-label="第 ${i+1} 集 ${n}">${i+1}</button>`).join('');
document.getElementById('epbtn').addEventListener('click',function(){
  const d=document.getElementById('drawer'),shut=d.classList.toggle('shut');this.classList.toggle('on',!shut);
  ['plmid','plbot'].forEach(id=>document.getElementById(id).classList.toggle('open',!shut));});

/* ---------- 4b 自动下一集 ---------- */
(()=>{const fg=document.getElementById('ringfg'),cd=document.getElementById('cd'),tt=document.getElementById('untitle'),
  sub=document.getElementById('unsub'),acts=document.getElementById('unacts'),C=182.2;let n,timer;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function start(){clearInterval(timer);n=5;paint();
    acts.innerHTML='<button class="c" id="uncancel">取消</button><button class="n" id="unnow">立即播放</button>';
    document.getElementById('uncancel').onclick=cancel;document.getElementById('unnow').onclick=play;
    timer=setInterval(()=>{n--;paint();if(n<=0){clearInterval(timer);play()}},1000)}
  function paint(){cd.textContent=n;tt.textContent=n+' 秒后播放 第 13 集 · 归途';
    fg.style.transition=reduce?'none':'stroke-dashoffset 1s linear';fg.style.strokeDashoffset=C*(1-n/5)}
  function cancel(){clearInterval(timer);tt.textContent='已停在第 12 集末尾';sub.textContent='想看下一集时，点“选集”或“下一集”';
    cd.textContent='';fg.style.strokeDashoffset=C;acts.innerHTML='<button class="c" id="again">再演示一次</button>';document.getElementById('again').onclick=()=>{sub.textContent='S01E13 归途.mkv，24 分钟';start()}}
  function play(){clearInterval(timer);cd.textContent='';fg.style.strokeDashoffset=0;tt.textContent='正在打开 第 13 集 · 归途';
    acts.innerHTML='<button class="c" id="again">再演示一次</button>';document.getElementById('again').onclick=start}
  start();})();

/* ---------- 5 缩略图条 ---------- */
(()=>{const s=document.getElementById('strip'),ph=document.getElementById('photo'),
  hues=[[-36,'18:21'],[-24,'18:24'],[-12,'18:27'],[0,'18:30'],[6,'18:33'],[12,'18:41'],[-48,'19:02'],[-60,'19:15']];let cur=3;
  s.innerHTML=hues.map((h,i)=>`<button aria-label="${h[1]} 的照片" style="background:linear-gradient(180deg,#4C3550,#C77A5A 50%,#2A1A1E 72%);filter:hue-rotate(${h[0]}deg)"></button>`).join('');
  const set=i=>{cur=i;[...s.children].forEach((b,j)=>b.setAttribute('aria-current',j===i));ph.style.filter=`hue-rotate(${hues[i][0]}deg)`;
    document.getElementById('pwhen').textContent='2025 年 6 月 12 日 '+hues[i][1];document.getElementById('pidx').textContent=(34+i)+' / 412';
    document.getElementById('pname').textContent='IMG_20250612_'+hues[i][1].replace(':','')+(i===3?'15':'02')+'.jpg'};
  s.addEventListener('click',e=>{const b=e.target.closest('button');if(b)set([...s.children].indexOf(b))});set(3);})();
</script>
